<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mykira Map — Peta Komuniti Sabah</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf3;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(11,15,20,.92); border: 1px solid #21262d; border-radius: 12px;
    padding: 14px; width: 268px; backdrop-filter: blur(8px);
  }
  .panel h1 { margin: 0 0 2px; font-size: 16px; }
  .panel p  { margin: 0 0 12px; color: #8b949e; font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #30363d; }
  button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .stat { display: flex; justify-content: space-between; font-size: 12px;
          color: #8b949e; padding: 2px 0; }
  .stat b { color: #e6edf3; font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------
     Log — KECIL dan BOLEH LIPAT.
     Ia bermula sebagai cip satu baris ("📋 Log"); ketik untuk mengembang.
     Sebelum ini ia panel penuh 340px yang selalu kelihatan.
     ------------------------------------------------------------ */
  .log {
    position: absolute; bottom: 12px; left: 12px; z-index: 10;
    background: rgba(11,15,20,.92); border: 1px solid #21262d; border-radius: 10px;
    width: 340px; max-width: calc(100vw - 24px);
    overflow: hidden;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    backdrop-filter: blur(8px);
  }
  .log .log-head {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; cursor: pointer; user-select: none;
    font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #8b949e;
  }
  .log .log-head:hover { background: #161b22; }
  .log .log-head .chev { margin-left: auto; transition: transform .2s; }
  .log.open .log-head .chev { transform: rotate(180deg); }
  .log .log-body { display: none; max-height: 150px; overflow: auto; padding: 0 10px 8px; }
  .log.open .log-body { display: block; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .ok   { color: #3fb950; }
  .log .err  { color: #f85149; }
  .log .info { color: #8b949e; }
  .log .ws   { color: #58a6ff; }

  .hint { position: absolute; top: 12px; right: 12px; z-index: 10;
          background: rgba(11,15,20,.92); border: 1px solid #21262d; border-radius: 10px;
          padding: 8px 11px; font-size: 11px; color: #8b949e; max-width: 250px; }

  /* ------------------------------------------------------------
     Profil pengguna — nama paparan + jantina
     ------------------------------------------------------------ */
  .profile {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #21262d;
  }
  .profile .profile-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
  }
  .profile label {
    font-size: 11px; color: #8b949e; width: 84px; flex: none;
  }
  .profile input, .profile select {
    flex: 1; min-width: 0;
    background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px;
    padding: 8px 9px; font-size: 13px; font-family: inherit;
  }
  .profile input:focus, .profile select:focus {
    outline: none; border-color: #1f6feb;
  }
  .profile-status { font-size: 11px; color: #3fb950; min-height: 14px; margin-top: 2px; }
  .profile-status.err { color: #f85149; }

  /* ------------------------------------------------------------
     Panel hotspot — senarai sel paling panas, disusun menurun.
     Setiap baris boleh diklik untuk terbang ke lokasi itu.
     ------------------------------------------------------------ */
  .hotspots {
    position: absolute; bottom: 12px; right: 12px; z-index: 10;
    background: rgba(11,15,20,.92); border: 1px solid #21262d; border-radius: 12px;
    padding: 10px 12px; width: 264px; max-height: 300px; overflow: auto;
    backdrop-filter: blur(8px);
  }
  .hotspots h2 { margin: 0 0 6px; font-size: 12px; color: #8b949e; font-weight: 600;
                 letter-spacing: .04em; text-transform: uppercase; }
  .hotspots .cell {
    display: flex; align-items: center; gap: 8px; padding: 5px 6px;
    border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .hotspots .cell:hover { background: #161b22; }
  .hotspots .rank { color: #8b949e; width: 16px; text-align: right; flex: none;
                    font-variant-numeric: tabular-nums; }
  .hotspots .bar { height: 6px; border-radius: 3px; flex: none; }
  .hotspots .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hotspots .n { color: #8b949e; flex: none; font-variant-numeric: tabular-nums; }
  .hotspots .empty { color: #8b949e; font-size: 12px; padding: 4px 2px; }

  /* warna mengikut jenis dominan — mesti sepadan dengan TYPE_META */
  .hotspots .bar.ACCIDENT     { background: #f85149; }
  .hotspots .bar.SPEED_TRAP   { background: #d29922; }
  .hotspots .bar.HAZARD       { background: #db6d28; }
  .hotspots .bar.TRAFFIC_JAM  { background: #58a6ff; }
  .hotspots .bar.POLICE       { background: #a371f7; }
  .hotspots .bar.ROAD_CLOSURE { background: #f85149; }

  /* ------------------------------------------------------------
     Mudah alih — panel BOLEH TUTUP.
     Pada telefon, panel kawalan ditutup pada mulanya supaya peta
     kelihatan. Pengguna membuka ia melalui butang ☰. Ini lebih baik
     daripada memampat panel sehingga ia masih menutup separuh skrin.
     ------------------------------------------------------------ */

  /* Butang terapung ☰ — hanya wujud pada skrin sempit */
  .fab {
    display: none;
    position: absolute; top: 12px; left: 12px; z-index: 30;
    width: 46px; height: 46px; border-radius: 14px;
    background: #1f6feb; border: 1px solid #1f6feb; color: #fff;
    font-size: 19px; line-height: 1; padding: 0;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  .fab:active { background: #388bfd; }

  @media (max-width: 640px) {
    .fab { display: block; }              /* ☰ terapung */

    /* panel tertutup pada mulanya; .panel.open membukanya */
    .panel {
      display: none;
      top: 68px; left: 10px; right: 10px; width: auto;
      max-height: 58vh; overflow-y: auto;
      padding: 10px;
    }
    .panel.open { display: block; }
    .panel h1 { font-size: 15px; }
    .panel p  { font-size: 11px; margin-bottom: 8px; }

    /* butang lebih besar untuk sentuhan jari */
    button { padding: 11px 12px; font-size: 13px; }
    #types button { padding: 9px 9px; font-size: 12px; }

    /* log tidak wujud pada telefon — ia hanya mengelirukan di skrin kecil */
    .log { display: none; }
    .log.open { display: block; }

    .hotspots {
      width: calc(100vw - 20px); right: 10px; bottom: 10px;
      max-height: 22vh; padding: 8px 10px;
    }
    .hint { display: none; }   /* tiada ruang untuk hint pada telefon */
  }
</style>
</head>
<body>
<div id="map"></div>

<!-- Butang terapung untuk membuka panel — hanya pada telefon -->
<button id="menu-toggle" class="fab" aria-label="Buka panel kawalan" aria-expanded="false">☰</button>

<div class="panel" id="panel">
  <h1>Mykira Map</h1>
  <p>Koridor KK → Putatan → Papar → Kimanis → Membakut</p>

  <div class="row" id="types">
    <button data-type="ACCIDENT"    class="active">🚨 Kemalangan</button>
    <button data-type="SPEED_TRAP">📷 Perangkap</button>
    <button data-type="HAZARD">⚠️ Bahaya</button>
    <button data-type="TRAFFIC_JAM">🚗 Sesak</button>
    <button data-type="POLICE">🚔 Polis</button>
    <button data-type="ROAD_CLOSURE">🚧 Tutup</button>
  </div>

  <div class="row">
    <button id="send">📍 Hantar di lokasi saya</button>
    <button id="locate">🎯 Cari saya</button>
    <button id="toggle-follow" title="Kamera mengikut pergerakan anda">🧭 Ikut saya</button>
  </div>

  <div class="row">
    <button id="toggle-ws">🔌 Sambung WS</button>
    <button id="route">🧭 Arah ke sini</button>
  </div>

  <div class="row">
    <button id="toggle-hotspot" class="active">🔥 Hotspot</button>
    <button id="toggle-points">📍 Semua laporan</button>
  </div>

  <hr style="border:none;border-top:1px solid #21262d;margin:10px 0" />

  <div class="stat"><span>Laporan berdekatan</span><b id="s-count">0</b></div>
  <div class="stat"><span>Dalam 5 km</span><b id="s-near">0</b></div>
  <div class="stat"><span>Kelajuan</span><b id="s-speed">0 km/j</b></div>
  <div class="stat"><span>Jitu lokasi</span><b id="s-acc">—</b></div>
  <div class="stat"><span>Online (sel ini)</span><b id="s-online">0</b></div>
  <div class="stat"><span>WebSocket</span><b id="s-ws">terputus</b></div>
  <div class="stat"><span>Sel geohash</span><b id="s-cell">—</b></div>

  <hr style="border:none;border-top:1px solid #21262d;margin:10px 0" />

  <!-- Profil pengguna — tanpa akaun, disimpan pada peranti dan D1.
       Nama lalai ialah ID automatik sedia ada. -->
  <div class="profile" id="profile">
    <div class="profile-row">
      <label for="profile-name">Nama Paparan</label>
      <input id="profile-name" type="text" maxlength="60" autocomplete="off"
             autocapitalize="words" spellcheck="false" />
    </div>
    <div class="profile-row">
      <label for="profile-gender">Jantina</label>
      <select id="profile-gender">
        <option value="">— Tidak dinyatakan —</option>
        <option value="MALE">Lelaki</option>
        <option value="FEMALE">Perempuan</option>
      </select>
    </div>
    <div class="row">
      <button id="save-profile">💾 Simpan Profil</button>
    </div>
    <div class="profile-status" id="profile-status"></div>
  </div>
</div>

<div class="hint" id="hint">
  Menunggu laluan API…
</div>

<div class="log" id="log">
  <div class="log-head" id="log-head" role="button" tabindex="0" aria-expanded="false">
    <span>📋 Log</span><span class="chev">▾</span>
  </div>
  <div class="log-body" id="log-body"></div>
</div>

<div class="hotspots" id="hotspots">
  <h2>🔥 Hotspot terpanas</h2>
  <div id="hotspot-list"><div class="empty">Memuatkan…</div></div>
</div>

<script>
// ============================================================
//  Konfigurasi
// ============================================================
/**
 * Asal API. KOSONG bermaksud "sama seperti laman ini" — jadi app berfungsi
 * tanpa sebarang konfigurasi sama ada dibuka di pelayar desktop, pada
 * telefon, atau melalui domain lain.
 *
 * Untuk melayan diri sendiri secara tempatan, jalankan `npm run dev` dan
 * set localStorage: lalin.api = 'http://localhost:8787'.
 */
const API_BASE = localStorage.getItem('lalin.api') || '';

/**
 * Origin penuh untuk panggilan fetch dan WebSocket.
 * Kosong → gunakan `location.origin` (satu origin, tanpa CORS lintas).
 */
const ORIGIN = API_BASE
  ? new URL(API_BASE).origin
  : (typeof location !== 'undefined' ? location.origin : '');

const DEVICE_ID = (() => {
  let id = localStorage.getItem('lalin.device');
  if (!id) { id = 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('lalin.device', id); }
  return id;
})();

// ============================================================
//  Profil pengguna — nama paparan + jantina
// ============================================================
// Tiada akaun: profil dipertanggungkanjawabkan kepada DEVICE_ID dan
// disimpan dalam localStorage. Ia dihantar bersama laporan, mesej
// WebSocket dan carian supaya pelapor dikenali di seluruh sistem —
// termasuk oleh aplikasi Android yang akan datang.
const PROFILE_NAME_KEY = 'lalin.username';
const PROFILE_GENDER_KEY = 'lalin.gender';
const DISPLAY_NAME_MAX = 60;

/**
 * Nama lalai — ID automatik sedia ada, supaya pengguna yang tidak
 * menetapkan nama masih dapat dikenali oleh orang lain.
 */
function defaultDisplayName() { return DEVICE_ID; }

/** `false` = profil telah berubah dan belum disegerakkan ke pelayan. */
let profilePushed = true;

/** Baca borang profil (nama telah dibuang ruangnya). */
function currentProfile() {
  return {
    displayName: $('profile-name').value.trim().slice(0, DISPLAY_NAME_MAX),
    gender: $('profile-gender').value,
  };
}

/** Isi borang daripada localStorage, atau nilai lalai. */
function loadProfileForm() {
  const status = $('profile-status');
  if (status) { status.textContent = ''; status.classList.remove('err'); }
  $('profile-name').value = localStorage.getItem(PROFILE_NAME_KEY) ?? defaultDisplayName();
  $('profile-gender').value = localStorage.getItem(PROFILE_GENDER_KEY) ?? '';
}

/**
 * Simpan profil ke localStorage DAN pelayan.
 *
 * localStorage supaya app kekal konsisten walaupun offline; pelayan supaya
 * profil terbawa bersama laporan dan mesej masa nyata.
 */
async function saveProfile() {
  const status = $('profile-status');
  const prof = currentProfile();
  try {
    await api('/api/v1/profile', { method: 'PATCH', body: JSON.stringify(prof) });
    localStorage.setItem(PROFILE_NAME_KEY, prof.displayName);
    localStorage.setItem(PROFILE_GENDER_KEY, prof.gender);
    profilePushed = false;   // dorong pada carian seterusnya
    if (status) { status.classList.remove('err'); status.textContent = '✓ Profil disimpan'; }
    log('ok', `profil disimpan — ${prof.displayName || '(tiada nama)'}`);
  } catch (e) {
    if (status) { status.classList.add('err'); status.textContent = `Gagal: ${e.message}`; }
    log('err', `profil gagal disimpan: ${e.message}`);
  }
}

const TYPE_META = {
  ACCIDENT:    { icon: '🚨', color: '#f85149' },
  SPEED_TRAP:  { icon: '📷', color: '#d29922' },
  HAZARD:      { icon: '⚠️', color: '#db6d28' },
  TRAFFIC_JAM: { icon: '🚗', color: '#58a6ff' },
  POLICE:      { icon: '🚔', color: '#a371f7' },
  ROAD_CLOSURE:{ icon: '🚧', color: '#f85149' },
  WEATHER:     { icon: '🌧️', color: '#3fb950' },
  COMMUNITY:   { icon: '📢', color: '#3fb950' },
};

const state = {
  type: 'ACCIDENT',
  // Zon operasi: koridor selatan Sabah. Pusat di Putatan supaya
  // KK dan Membakut berada pada jarak yang hampir sama.
  // (Sepanggar, Inanam, Donggongon, Penampang, Putatan, KKIA, Petagas,
  //  Lok Kawi, Papar, Kimanis dan Kg Pimping semuanya dalam 90 km.)
  center: { lat: 5.8943, lng: 116.0505 },
  ws: null,
  markers: new Map(),
  routeLayer: null,
  wsRetry: 0,
  // Paparan hotspot: giliran antara kluster (hotspot) dan penanda individu.
  hotspotMode: true,
  hotspotsReady: false,
  hotspotRows: [],   // sel terkini dari /api/v1/hotspots

  // Penjejakan langsung — lihat startTracking().
  cell: null,             // sel geohash p6 semasa
  watchId: null,          // id watchPosition, null = tidak berjalan
  following: false,       // kamera mengikut pengguna (mod "ikut saya")
  trail: [],              // jejak pergerakan, [lng, lat]
  lastSessionPush: 0,     // doh::now_ms sesi terakhir dihantar
  lastCount: null,        // bilangan laporan lepas — elak log berulang
};

/** Had geofence zon operasi (meter) — mesti sepadan dengan pelayan. */
const GEOFENCE_RADIUS_M = 90000;

/** Saiz sel grid hotspot pada peta (mesti sepadan dengan pelayan). */
const HOTSPOT_GRID_DP = 3;
/** Bilangan hotspot teratas yang disenaraikan. */
const HOTSPOT_LIMIT = 10;

const $ = (id) => document.getElementById(id);
const logEl = $('log');
const logBody = $('log-body');
const logHead = $('log-head');

/**
 * Tulis ke log.
 *
 * Hanya SIMpan dalam `log-body` — kepala cip kekal di atasnya. Log juga
 * dipangkas kepada 40 baris supaya ia tidak pernah menjadi besar.
 */
function log(kind, msg) {
  const d = document.createElement('div');
  d.className = kind;
  const t = new Date().toLocaleTimeString('ms');
  d.textContent = `${t} ${msg}`;
  logBody.appendChild(d);
  logBody.scrollTop = logBody.scrollHeight;
  while (logBody.children.length > 40) logBody.removeChild(logBody.firstChild);

  // Tukar tajuk cip kepada mesej terakhir supaya ada makluma walaupun
  // log dilipat — tetapi jangan timbangkan ralat.
  if (logHead && kind === 'err') {
    const label = logHead.querySelector('span');
    if (label) label.textContent = '⚠ Log';
  }
}

/** Lipat / buka log (juga untuk papan kekunci). */
function toggleLog(force) {
  const open = force ?? !logEl.classList.contains('open');
  logEl.classList.toggle('open', open);
  if (logHead) logHead.setAttribute('aria-expanded', String(open));
  if (open) logBody.scrollTop = logBody.scrollHeight;
}

if (logHead) {
  logHead.addEventListener('click', () => toggleLog());
  logHead.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLog(); }
  });
}

function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', 'X-Device-Id': DEVICE_ID, ...(opts.headers || {}) };
  return fetch(API_BASE + path, { ...opts, headers }).then(async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  });
}

// ============================================================
//  geohash (client — untuk sel WS)
// ============================================================
const B32 = '0123456789bcdefghjkmnpqrstuvwxyz';
function geohash(lat, lng, precision = 6) {
  let idx = 0, bit = 0, even = true, hash = '';
  let latMin = -90, latMax = 90, lngMin = -180, lngMax = 180;
  while (hash.length < precision) {
    if (even) {
      const mid = (lngMin + lngMax) / 2;
      if (lng >= mid) { idx = idx * 2 + 1; lngMin = mid; } else { idx = idx * 2; lngMax = mid; }
    } else {
      const mid = (latMin + latMax) / 2;
      if (lat >= mid) { idx = idx * 2 + 1; latMin = mid; } else { idx = idx * 2; latMax = mid; }
    }
    even = !even;
    if (++bit === 5) { hash += B32[idx]; bit = 0; idx = 0; }
  }
  return hash;
}

// ============================================================
//  Peta
// ============================================================
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [state.center.lng, state.center.lat],
  // z10 memaparkan keseluruhan koridor KK–Membakut (~160 km) sekali lihat.
  zoom: 10,
  attributionControl: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

// ------------------------------------------------------------
//  Lapisan hotspot — kluster GeoJSON native MapLibre (supercluster)
//
//  Sumber kluster dibekalkan SEL dari /api/v1/hotspots — BUKAN titik mentah.
//  Jika titik mentah digunakan, MapLibre mengira klasternya sendiri dengan
//  radius bawaannya dan klaster peta tidak akan sepadan dengan sel grid
//  ~111 m dalam panel. Satu sumber, satu grid.
// ------------------------------------------------------------
const HOTSPOT_SRC = 'hotspots';

// warna & ikon mengikut jenis — mesti sepadan dengan TYPE_META
const TYPE_COLOR = Object.fromEntries(
  Object.entries(TYPE_META).map(([k, v]) => [k, v.color]),
);

map.on('load', () => {
  // `cluster: true` menghidupkan supercluster — tiada pek tambahan.
  map.addSource(HOTSPOT_SRC, {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
    cluster: true,
    // di bawah z14, laporan individu dipaparkan terus
    clusterMaxZoom: 14,
    clusterRadius: 55,
  });

  // gumpalan — saiz & warna mengikut bilangan laporan
  map.addLayer({
    id: 'hotspot-clusters',
    type: 'circle',
    source: HOTSPOT_SRC,
    filter: ['has', 'point_count'],
    paint: {
      'circle-radius': [
        'step', ['get', 'point_count'],
        18, 3, 24, 10, 32, 25, 40, 60, 48,
      ],
      // biru (kecil) → kuning → merah (panas)
      'circle-color': [
        'step', ['get', 'point_count'],
        '#1f6feb', 5, '#d29922', 20, '#f85149',
      ],
      'circle-opacity': 0.88,
      'circle-stroke-width': 2,
      'circle-stroke-color': '#ffffff',
    },
  });

  // bilangan di tengah gumpalan
  map.addLayer({
    id: 'hotspot-count',
    type: 'symbol',
    source: HOTSPOT_SRC,
    filter: ['has', 'point_count'],
    layout: {
      'text-field': ['get', 'point_count_abbreviated'],
      'text-size': 13,
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
    },
    paint: { 'text-color': '#ffffff' },
  });

  // titik individu — warna ikut jenis insiden
  map.addLayer({
    id: 'hotspot-points',
    type: 'circle',
    source: HOTSPOT_SRC,
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-radius': 11,
      'circle-color': [
        'match', ['get', 'type'],
        ...Object.entries(TYPE_COLOR).flat(),
        '#3fb950',
      ],
      'circle-opacity': 0.92,
      'circle-stroke-width': 2,
      'circle-stroke-color': '#ffffff',
    },
  });

  // klik gumpalan → zum masuk untuk melihat laporan di dalamnya
  map.on('click', 'hotspot-clusters', (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['hotspot-clusters'] })[0];
    if (!f) return;
    const [lng, lat] = f.geometry.coordinates;
    map.easeTo({ center: [lng, lat], zoom: Math.min(16, map.getZoom() + 2) });
  });

  // klik titik → popout dengan butang undi
  map.on('click', 'hotspot-points', (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['hotspot-points'] })[0];
    if (!f) return;
    const p = f.properties;
    const meta = TYPE_META[p.type] || { icon: '📍' };
    new maplibregl.Popup({ offset: 14, closeButton: false })
      .setLngLat(f.geometry.coordinates)
      .setHTML(
        `<div style="min-width:140px">
           <b>${meta.icon} ${p.type}</b>
           <div style="color:#8b949e;font-size:11px;margin-top:2px">
             ✓${p.confirmCount} ✗${p.dismissCount}
           </div>
           ${p.note ? `<div style="font-size:11px;margin:4px 0">${String(p.note).replace(/</g, '&lt;')}</div>` : ''}
           <div style="display:flex;gap:5px;margin-top:6px">
             <button onclick="vote('${p.id}',1)" style="font-size:11px;padding:3px 8px">✓ Ada</button>
             <button onclick="vote('${p.id}',0)" style="font-size:11px;padding:3px 8px">✗ Tiada</button>
           </div>
         </div>`,
      )
      .addTo(map);
  });

  // penunjuk tangan semasa melayang di atas sesuatu yang boleh diklik
  for (const id of ['hotspot-clusters', 'hotspot-points']) {
    map.on('mouseenter', id, () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; });
  }

  state.hotspotsReady = true;
  applyViewMode();
  log('info', 'lapisan hotspot sedia');
});

// penanda lokasi pengguna — gaya Waze: anak panah yang BERPUTAR mengikut
// haluan, dan bergerak LANCAR (interpolasi sendiri, bukan lompatan).
//
// Lapisan luar (#me-pos) diletakkan oleh MapLibre. Lapisan dalam (#me-arrow)
// pula berputar mengikut `heading` — MapLibre tidak mengubah `transform`
// elemen dalam, jadi kedua-duanya boleh wujud serentak.
const meEl = document.createElement('div');
meEl.id = 'me-pos';
meEl.style.cssText = 'width:34px;height:34px;pointer-events:none;';
const meArrow = document.createElement('div');
meArrow.id = 'me-arrow';
meArrow.textContent = '▲';
meArrow.style.cssText = [
  'position:absolute;left:50%;top:50%;',
  'transform:translate(-50%,-58%) rotate(0deg);',
  'font-size:26px;line-height:1;color:#1f6feb;',
  'text-shadow:0 0 5px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,1);',
  'transition:transform .25s ease-out;',
].join('');
meEl.appendChild(meArrow);
const meMarker = new maplibregl.Marker({ element: meEl }).setLngLat([state.center.lng, state.center.lat]).addTo(map);

/** Putar anak panah mengikut haluan (darjah, 0 = utara). */
function setMeHeading(heading) {
  if (heading == null || !Number.isFinite(heading)) return;
  meArrow.style.transform = `translate(-50%,-58%) rotate(${Math.round(heading)}deg)`;
}

// ------------------------------------------------------------
//  Lukis laporan
// ------------------------------------------------------------
function markerFor(report) {
  const meta = TYPE_META[report.type] || { icon: '📍', color: '#3fb950' };
  const el = document.createElement('div');
  el.style.cssText = `width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
                      background:${meta.color};font-size:15px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer`;
  el.textContent = meta.icon;
  el.title = `${report.type} · RM${report.severity ?? ''} · ${report.distanceM != null ? (report.distanceM/1000).toFixed(2)+' km' : ''}`;

  const popup = new maplibregl.Popup({ offset: 18, closeButton: false }).setHTML(
    `<div style="min-width:150px">
       <b>${meta.icon} ${report.type}</b>
       <div style="color:#8b949e;font-size:11px;margin:2px 0">
         ${report.distanceM != null ? (report.distanceM/1000).toFixed(2) + ' km · ' : ''}
         ✓${report.confirmCount} ✗${report.dismissCount}
       </div>
       ${report.note ? `<div style="font-size:11px;margin:4px 0">${report.note.replace(/</g,'&lt;')}</div>` : ''}
       <div style="display:flex;gap:5px;margin-top:6px">
         <button onclick="vote('${report.id}',1)" style="font-size:11px;padding:3px 8px">✓ Ada</button>
         <button onclick="vote('${report.id}',0)" style="font-size:11px;padding:3px 8px">✗ Tiada</button>
       </div>
     </div>`,
  );
  return new maplibregl.Marker({ element: el }).setLngLat([report.lng, report.lat]).setPopup(popup);
}

function upsertMarker(report) {
  const existing = state.markers.get(report.id);
  if (existing) existing.remove();
  const m = markerFor(report);
  state.markers.set(report.id, m);
  // Hanya dipaparkan dalam mod "Semua laporan" — lihat applyViewMode().
  // Penanda kekal dalam `state.markers` supaya togol tidak kehilangan data.
  if (!state.hotspotMode) m.addTo(map);
}

function removeMarker(id) {
  const m = state.markers.get(id);
  if (m) { m.remove(); state.markers.delete(id); }
}

// ============================================================
//  Hotspot — GeoJSON untuk lapisan kluster
// ============================================================
/**
 * Tukar SEL HOTSPOT (dari /api/v1/hotspots) menjadi GeoJSON.
 *
 * PENTING: sumber kluster dibekalkan SEL, bukan titik mentah. Jika ia
 * dibekalkan titik mentah, MapLibre mengira klasternya sendiri dengan
 * radius bawaannya — dan klaster peta tidak akan pernah sepadan dengan
 * sel grid ~111 m yang disenarai dalam panel. Satu sumber, satu grid.
 */
function hotspotGeoJSON(cells) {
  return {
    type: 'FeatureCollection',
    features: cells.map((c) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
      properties: {
        id: `hotspot-${c.rank}`,
        type: c.dominantType,
        note: '',
        severity: 0,
        confirmCount: 0,
        dismissCount: 0,
        total: c.total,
        heat: c.heat,
      },
    })),
  };
}

/**
 * Segerakkan lapisan kluster dengan sel hotspot terkini.
 *
 * Disimpan dalam `state.hotspotRows` supaya togol pandangan tidak kehilangan
 * data, dan supaya `refresh()` boleh memaksa semula tanpa membuat panggilan
 * kedua. Gagal di sini TIDAK boleh menggagalkan peta — kluster kekal berfungsi
 * daripada sel terakhir yang berjaya dimuat.
 */
function syncHotspots(cells) {
  state.hotspotRows = cells;
  if (!state.hotspotsReady) return;   // peta belum sedia; refresh() akan panggil semula
  map.getSource(HOTSPOT_SRC).setData(hotspotGeoJSON(cells));
}

/**
 * Togol antara paparan hotspot (klaster) dan penanda individu.
 *
 * Kedua-duanya TIDAK dipaparkan serentak — pada z10 klaster memberi gambaran
 * kepadatan, manakala penanda individu menjadi tidak berguna apabila beratus-ratus
 * bertindan. Memaparkan kedua-duanya hanya menghasilkan peta yang sesak.
 */
function applyViewMode() {
  const hotspotLayers = ['hotspot-clusters', 'hotspot-count', 'hotspot-points'];
  const on = state.hotspotMode;

  if (state.hotspotsReady) {
    for (const id of hotspotLayers) {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
    }
  }
  // penanda individu hanya dalam mod "Semua laporan"
  for (const m of state.markers.values()) {
    if (!on) m.addTo(map); else m.remove();
  }
  $('toggle-hotspot').classList.toggle('active', on);
  $('toggle-points').classList.toggle('active', !on);
}

// ============================================================
//  Senarai kedudukan hotspot (dari /api/v1/hotspots)
// ============================================================
/** Nama mudah untuk satu sel — jarak dari Putatan, bukan nama jalan. */
function cellName(lat, lng) {
  const dLat = lat - 5.8943, dLng = lng - 116.0505;
  const km = Math.round(Math.hypot(dLat * 111.32, dLng * 111.32) * 10) / 10;
  if (km < 1) return 'Pusat Putatan';
  const arah = dLat > 0 ? 'utara' : 'selatan';
  return `${km} km ${arah} Putatan`;
}

async function renderHotspots() {
  const b = map.getBounds();
  const list = $('hotspot-list');
  try {
    const res = await api(
      `/api/v1/hotspots?minLat=${b.getSouth()}&maxLat=${b.getNorth()}` +
      `&minLng=${b.getWest()}&maxLng=${b.getEast()}` +
      `&gridDp=${HOTSPOT_GRID_DP}&limit=${HOTSPOT_LIMIT}`,
    );
    const rows = res.data;
    // Satu panggilan membekalkan kedua-dua permukaan: senarai kedudukan
    // DAN lapisan kluster di atas. Lihat hotspotGeoJSON().
    syncHotspots(rows);
    if (!rows.length) {
      list.innerHTML = '<div class="empty">Tiada laporan dalam pandangan ini</div>';
      return;
    }

    const max = rows[0].total;
    list.innerHTML = rows.map((h) => {
      const meta = TYPE_META[h.dominantType] || { icon: '📍' };
      const w = Math.max(8, Math.round((h.total / max) * 72));
      return (
        `<div class="cell" data-lat="${h.lat}" data-lng="${h.lng}" data-zoom="13">
           <span class="rank">${h.rank}</span>
           <span class="bar ${h.dominantType}" style="width:${w}px" title="${h.total} laporan"></span>
           <span class="name">${meta.icon} ${cellName(h.lat, h.lng)}</span>
           <span class="n">${h.total}</span>
         </div>`
      );
    }).join('');

    for (const el of list.querySelectorAll('.cell')) {
      el.onclick = () => {
        map.flyTo({
          center: [Number(el.dataset.lng), Number(el.dataset.lat)],
          zoom: Number(el.dataset.zoom) || 13,
        });
      };
    }
  } catch (e) {
    list.innerHTML = `<div class="empty">Hotspot tidak tersedia: ${e.message}</div>`;
  }
}

window.vote = async (id, isConfirm) => {
  try {
    await api(`/api/v1/reports/${id}/${isConfirm ? 'confirm' : 'dismiss'}?cell=${geohash(state.center.lat, state.center.lng, 6)}`, { method: 'POST' });
    log('ok', `${isConfirm ? '✓' : '✗'} ${id.slice(0, 8)}`);
    await refresh();
  } catch (e) { log('err', e.message); }
};

// ============================================================
//  Ambil laporan
// =============================================
async function refresh() {
  const { lat, lng } = state.center;
  // Radius ikut jumlah pandangan peta, tetapi tidak pernah melebihi
  // geofence zon operasi — pelayan juga mengekalkan had yang sama.
  const span = map.getBounds().getEast() - map.getBounds().getWest();
  const radius = Math.max(500, span > 0 ? estimateRadius() : GEOFENCE_RADIUS_M);
  try {
    // Hantar profil HANYA apabila ia belum disegerakkan. `refresh()`
    // dipanggil pada setiap `moveend`, jadi menghantarnya setiap kali akan
    // menulis ke D1 setiap kali peta digerakkan.
    let path = `/api/v1/reports/nearby?lat=${lat}&lng=${lng}&radiusM=${Math.min(radius, GEOFENCE_RADIUS_M)}&limit=200`;
    if (!profilePushed) {
      const prof = currentProfile();
      path += `&displayName=${encodeURIComponent(prof.displayName)}&gender=${encodeURIComponent(prof.gender)}`;
    }
    const res = await api(path);
    if (!profilePushed) profilePushed = true;
    const reports = res.data;
    $('s-count').textContent = reports.length;
    const near = reports.filter((r) => (r.distanceM ?? 9e9) <= 5000).length;
    $('s-near').textContent = near;
    // Penanda individu hanya dalam mod "Semua laporan" — lihat applyViewMode().
    for (const r of reports) upsertMarker(r);

    // Jangan log pada setiap moveend — `refresh()` dipanggil setiap kali
    // peta digerakkan, dan log penuh dengan "muat 7 laporan" yang sama.
    if (reports.length !== state.lastCount) {
      state.lastCount = reports.length;
      log('info', `muat ${reports.length} laporan`);
    }
  } catch (e) {
    log('err', e.message);
  }

  // Lapisan kluster dibekalkan SEL HOTSPOT, bukan titik mentah — jadi ia
  // memaksa semula daripada sel yang dihantar endpoint agregasi.
  syncHotspots(state.hotspotRows || []);

  // Senarai kedudukan hotspot + lapisan kluster — satu panggilan agregasi.
  // Gagal di sini tidak boleh menggagalkan peta (penanda tetap berfungsi).
  renderHotspots().catch(() => {});
}

function estimateRadius() {
  // anggaran jarak dari pusat ke timur peti
  const c = map.getCenter();
  const e = map.getBounds().getEast();
  const dLng = e - c.lng;
  return Math.round(Math.abs(dLng) * 111_320 * Math.cos((c.lat * Math.PI) / 180));
}

// ============================================================
//  WebSocket
// ============================================================
function wsUrl() {
  const cell = geohash(state.center.lat, state.center.lng, 6);
  // `ORIGIN` sudah selesai http/https — tukar kepada ws/wss untuk WebSocket.
  return `${ORIGIN.replace(/^http/, 'ws')}/api/v1/ws?cell=${cell}`;
}

function connectWs() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
  const url = wsUrl();
  $('s-cell').textContent = geohash(state.center.lat, state.center.lng, 6);
  try {
    state.ws = new WebSocket(url);
  } catch (e) { log('err', 'WS gagal: ' + e.message); return; }

  state.ws.onopen = () => {
    state.wsRetry = 0;
    $('s-ws').textContent = 'tersambung';
    const cell = geohash(state.center.lat, state.center.lng, 6);
    log('ws', `sambung ke sel ${cell}`);
    // Profil dibawa bersama langganan supaya sel/jiranan mengenali
    // pengguna ini — bukan sekadar bilangan tanpa nama.
    const prof = currentProfile();
    state.ws.send(JSON.stringify({
      kind: 'subscribe',
      cell,
      lat: state.center.lat,
      lng: state.center.lng,
      displayName: prof.displayName,
      gender: prof.gender || null,
    }));
  };
  state.ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.kind === 'report.new') {
      log('ws', `laporan baharu ${msg.report?.type ?? ''}`);
      upsertMarker(msg.report);
      $('s-count').textContent = Number($('s-count').textContent) + 1;
    } else if (msg.kind === 'report.confirm') {
      log('ws', `✓ ${String(msg.id).slice(0,8)} → ${msg.confirmCount}`);
    } else if (msg.kind === 'report.dismiss') {
      log('ws', `✗ ${String(msg.id).slice(0,8)} → ${msg.dismissCount}`);
    } else if (msg.kind === 'report.expire') {
      removeMarker(msg.id);
    } else if (msg.kind === 'presence') {
      $('s-online').textContent = msg.online;
    }
  };
  state.ws.onclose = () => {
    $('s-ws').textContent = 'terputus';
    log('ws', 'terputus — cuba semula…');
    if (state.wsRetry < 6) {
      state.wsRetry++;
      setTimeout(connectWs, Math.min(15000, 1000 * 2 ** state.wsRetry));
    }
  };
  state.ws.onerror = () => {};
}

// ============================================================
//  Hantar laporan
// ============================================================
async function sendReport() {
  const pos = meMarker.getLngLat();
  try {
    // Profil dihantar bersama laporan supaya pelapor dikenali walaupun
    // mereka tidak pernah menekan "Simpan Profil".
    const prof = currentProfile();
    const res = await api('/api/v1/reports', {
      method: 'POST',
      body: JSON.stringify({
        type: state.type,
        lat: pos.lat,
        lng: pos.lng,
        note: 'Dihantar dari peta',
        displayName: prof.displayName,
        gender: prof.gender || null,
      }),
    });
    log('ok', `${TYPE_META[state.type].icon} ${state.type} dihantar (${res.data.id.slice(0, 8)})`);
    upsertMarker(res.data);
    await refresh();
  } catch (e) { log('err', e.message); }
}

// ============================================================
//  Lokasi saya — PENJEJAKAN BERTERUSAN (gaya Waze)
//
//  Sebelum ini `locate()` menggunakan `getCurrentPosition` — satu pukul.
//  Selepas tetapan pertama, TIADA apa-apa yang berlaku lagi: penanda
//  kekal di tempatnya walaupun pengguna memandu sejauh 40 km. Ini punca
//  peta rasa "kaku".
//
//  Sekarang `watchPosition` memantau setiap perubahan, dan penanda
//  DIINTERPOLASI dari kedudukan lama ke baharu supaya ia meluncur, bukan
//  melompat. Kamera mengikut apabila `state.following` benar.
// ============================================================

/** Interpolasi penanda semasa. `null` = tiada animasi berjalan. */
let meAnim = null;
let meAnimRaf = 0;

/** smoothstep — permulaan dan penghujung lembut, tiada "tersentak". */
const easeInOut = (t) => t * t * (3 - 2 * t);

function meLoop() {
  meAnimRaf = requestAnimationFrame(() => {
    if (!meAnim) { meAnimRaf = 0; return; }
    const t = Math.min(1, (performance.now() - meAnim.start) / meAnim.dur);
    const e = easeInOut(t);
    const lat = meAnim.from.lat + (meAnim.to.lat - meAnim.from.lat) * e;
    const lng = meAnim.from.lng + (meAnim.to.lng - meAnim.from.lng) * e;
    meMarker.setLngLat([lng, lat]);
    if (state.following) map.setCenter([lng, lat]);
    if (t < 1) meLoop();
    else { meAnim = null; meAnimRaf = 0; }
  });
}

/**
 * Gerakkan penanda ke kedudukan baharu dengan LANCAR.
 *
 * Jarak panjang (mis. selepas GPS kembali selepas mati) dilompat terus —
 * menganimasikannya akan membuat penanda "terbang" merentas peta.
 */
function moveMe(lat, lng) {
  const from = { lat: state.center.lat, lng: state.center.lng };
  const dist = Math.hypot((lat - from.lat) * 111_320, (lng - from.lng) * 111_320);
  if (dist > 2_000) {
    meMarker.setLngLat([lng, lat]);
    state.center = { lat, lng };
    return;
  }
  meAnim = { from, to: { lat, lng }, start: performance.now(), dur: 850 };
  if (!meAnimRaf) meLoop();
}

/** Tambah titik pada jejak pergerakan. */
function pushTrail(lat, lng) {
  const last = state.trail[state.trail.length - 1];
  if (last && Math.hypot((lat - last[1]) * 111_320, (lng - last[0]) * 111_320) < 15) return;
  state.trail.push([lng, lat]);
  if (state.trail.length > 600) state.trail.shift();
  if (!map.getSource('trail')) {
    map.addSource('trail', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } } });
    map.addLayer({
      id: 'trail', type: 'line', source: 'trail',
      paint: { 'line-color': '#1f6feb', 'line-width': 4, 'line-opacity': .75 },
    });
  }
  map.getSource('trail').setData({
    type: 'Feature', properties: {},
    geometry: { type: 'LineString', coordinates: state.trail },
  });
}

/** Suntik semula profil ke sesi langsung (hanya nama/jantina berubah). */
async function pushSession(lat, lng, heading, speed) {
  try {
    await api('/api/v1/reports/session', {
      method: 'POST',
      body: JSON.stringify({
        lat, lng, heading,
        speedKmh: speed != null ? speed * 3.6 : null,
        ...currentProfile(),
      }),
    });
  } catch { /* sesi bukan kritikal */ }
}

/**
 * Mula penjejakan berterusan.
 *
 * `maximumAge: 0` supaya kita tidak menerima jawapan cache lama, dan
 * `timeout` panjang kerana GPS kadangkala mengambil masa untuk kunci.
 */
function startTracking() {
  if (!navigator.geolocation) { log('err', 'geolocation tidak disokong'); return; }
  if (state.watchId !== null) return;   // sudah berjalan

  log('info', 'penjejakan lokasi bermula…');
  state.watchId = navigator.geolocation.watchPosition(
    (p) => {
      const { latitude: lat, longitude: lng, accuracy, heading, speed } = p.coords;
      const prevCell = state.cell;
      state.center = { lat, lng };
      state.cell = geohash(lat, lng, 6);

      moveMe(lat, lng);
      setMeHeading(heading);
      pushTrail(lat, lng);
      $('s-speed').textContent = speed != null && speed > 0.3 ? `${Math.round(speed * 3.6)} km/j` : '0 km/j';
      $('s-acc').textContent = `±${Math.round(accuracy ?? 0)} m`;

      // Sel geohash berubah → langgan semula supaya siaran jiranan sah.
      if (prevCell && prevCell !== state.cell) {
        log('ws', `menyeberangi sempadan sel → ${state.cell}`);
        connectWs();
        refresh();
      } else if (!prevCell) {
        connectWs();
        refresh();
      }

      // daftar kehadiran — tidak setiap tetapan (terlalu kerap)
      const now = Date.now();
      if (now - state.lastSessionPush > 15_000) {
        state.lastSessionPush = now;
        pushSession(lat, lng, heading, speed);
      }
    },
    (e) => log('err', `penjejakan: ${e.message}`),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20_000 },
  );
}

/** Alihkan mod "ikut saya" dan pusatkan semula. */
function toggleFollow() {
  state.following = !state.following;
  const b = $('toggle-follow');
  if (b) b.classList.toggle('active', state.following);
  if (state.following) {
    map.easeTo({ center: [state.center.lng, state.center.lat], duration: 400 });
    log('ok', 'mod ikut diaktifkan');
  } else {
    log('info', 'mod ikut dimatikan — anda bebas menggerakkan peta');
  }
}

/** Cari saya — pusatkan pada kedudukan semasa serta-merta. */
function locate() {
  if (!navigator.geolocation) { log('err', 'geolocation tidak disokong'); return; }
  navigator.geolocation.getCurrentPosition(
    (p) => {
      const { latitude: lat, longitude: lng, accuracy } = p.coords;
      state.center = { lat, lng };
      state.cell = geohash(lat, lng, 6);
      meMarker.setLngLat([lng, lat]);
      map.easeTo({ center: [lng, lat], zoom: 15, duration: 600 });
      log('ok', `lokasi ${lat.toFixed(5)}, ${lng.toFixed(5)} ±${Math.round(accuracy ?? 0)}m`);
      pushTrail(lat, lng);
    },
    (e) => log('err', 'lokasi gagal: ' + e.message),
    { enableHighAccuracy: true, maximumAge: 5_000, timeout: 12_000 },
  );
}

// ============================================================
//  Routing
// ============================================================
async function route() {
  const pos = meMarker.getLngLat();
  const c = map.getCenter();
  try {
    const res = await api(`/api/v1/routing?lat1=${pos.lat}&lng1=${pos.lng}&lat2=${c.lat}&lng2=${c.lng}`);
    const g = res.data.geometry;
    if (state.routeLayer) { map.removeLayer('route'); map.removeSource('route'); }
    map.addSource('route', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: g } });
    map.addLayer({
      id: 'route', type: 'line', source: 'route',
      paint: { 'line-color': '#1f6feb', 'line-width': 5, 'line-opacity': .85 },
    });
    state.routeLayer = true;
    log('ok', `laluan ${(res.data.distanceM/1000).toFixed(1)} km · ${Math.round(res.data.durationS/60)} min · ${res.data.provider}`);
  } catch (e) { log('err', 'routing: ' + e.message); }
}

// ============================================================
//  Acara UI
// ============================================================
$('types').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-type]');
  if (!b) return;
  document.querySelectorAll('#types button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active');
  state.type = b.dataset.type;
});

$('send').onclick = sendReport;
$('locate').onclick = locate;
$('toggle-follow').onclick = toggleFollow;
$('toggle-ws').onclick = () => { if (state.ws) { state.ws.close(); } else connectWs(); };
$('route').onclick = route;
$('save-profile').onclick = saveProfile;

// Pengguna menggerakkan peta sendiri → mod "ikut saya" mesti padam.
// Jika tidak, kamera akan melawan sentuhan pengguna sehingga mereka
// memuat semula halaman.
map.on('dragstart', () => {
  if (!state.following) return;
  state.following = false;
  const b = $('toggle-follow');
  if (b) b.classList.remove('active');
  log('info', 'mod ikut dimatikan — anda menggerakkan peta');
});

// Togol hotspot ↔ penanda individu
$('toggle-hotspot').onclick = () => { state.hotspotMode = true; applyViewMode(); };
$('toggle-points').onclick = () => { state.hotspotMode = false; applyViewMode(); };

// ------------------------------------------------------------
//  Panel kawalan boleh tutup (mudah alih)
// ------------------------------------------------------------
// Pada telefon panel bermula TERTUTUP supaya peta kelihatan — memampat
// panel sehingga ia masih menutup separuh skrin adalah lebih buruk
// daripada menyembunyikannya sehingga diperlukan.
const MOBILE = () => window.matchMedia('(max-width: 640px)').matches;

function setPanel(open) {
  const p = $('panel');
  if (!p) return;
  p.classList.toggle('open', open);
  const b = $('menu-toggle');
  if (b) {
    b.textContent = open ? '✕' : '☰';
    b.setAttribute('aria-expanded', String(open));
    b.setAttribute('aria-label', open ? 'Tutup panel kawalan' : 'Buka panel kawalan');
  }
}

$('menu-toggle').onclick = () => setPanel(!$('panel').classList.contains('open'));

// Desktop: panel sentiasa terbuka dan ☰ tersembunyi.
// Mudah alih: bermula tertutup.
function syncPanel() { setPanel(!MOBILE()); }
syncPanel();
window.addEventListener('resize', syncPanel);

map.on('moveend', () => {
  const c = map.getCenter();
  state.center = { lat: c.lat, lng: c.lng };
  $('s-cell').textContent = geohash(c.lat, c.lng, 6);
  refresh();
});

// ============================================================
//  Permulaan
// ============================================================
/**
 * Semak kesihatan API, kemudian muat laporan.
 *
 * MESTI dipanggil semasa permulaan — tanpa ini petunjuk kekal sebagai teks
 * placeholder "Menunggu laluan API…" selamanya walaupun app berfungsi, kerana
 * `locate()` hanya memicu `refresh()` dan `connectWs()` secara tidak langsung
 * (melalui `moveend`), bukan pemeriksaan kesihatan ini.
 */
async function boot() {
  // Isi borang dengan nilai tempatan dahulu supaya ia terus berguna,
  // kemudian gantikan dengan salinan pelayar jika ada.
  loadProfileForm();

  try {
    const h = await api('/healthz');
    $('hint').innerHTML = `API: <b>${ORIGIN}</b><br>peranti: <code>${DEVICE_ID.slice(0, 12)}…</code>`;
    log('ok', `API sihat — ${h.status}`);
  } catch (e) {
    $('hint').innerHTML = `⚠️ <b>API tidak dicapai</b> di ${ORIGIN}<br>Pastikan Worker sudah dideploy, dan cuba muat semula laman ini.`;
    log('err', `API tidak dicapai: ${e.message}`);
  }

  // Pulihkan profil dari pelayan — peranti baharu, atau selepas
  // localStorage dikosongkan, masih mendapat nama yang sama.
  try {
    const res = await api('/api/v1/profile');
    if (res.data) {
      // Baris pengguna wujud — pelayan adalah salinan rasmi.
      $('profile-name').value = res.data.displayName || defaultDisplayName();
      $('profile-gender').value = res.data.gender || '';
    }
  } catch {
    // tiada profil pelayan (peranti pertama kali) — kekal pada nilai tempatan
  }

  refresh();

  // PENYELESAN ISU "PETA KAKU": penjejakan berterusan bermula di sini.
  // `locate()` sahaja hanya memberi satu tetapan, jadi penanda kekal
  // membeku selepas itu walaupun pengguna memandu.
  startTracking();
}

boot();

// `locate()` melontar peta ke lokasi pengguna. Ini mencetuskan `moveend`
// → `refresh()`, dan pada keberhasilan geolokasi → `connectWs()`.
locate();
setInterval(() => { if (state.ws?.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify({ kind: 'ping' })); }, 25000);
</script>
