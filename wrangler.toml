name = "mykira-map"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------
#  Peta sumber
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "mykira-map"
database_id = "ab655b48-8b45-4fb3-a55c-70210837344d"
migrations_dir = "db"

# ------------------------------------------------------------
#  Durable Objects — siaran masa nyata berasaskan sel geohash
# ------------------------------------------------------------
[[durable_objects.bindings]]
name = "GRID"
class_name = "GridDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GridDO"]

# ------------------------------------------------------------
#  Cron — tamatkan laporan lama, buang sesi mati
# ------------------------------------------------------------
[triggers]
crons = ["*/5 * * * *"]

# ------------------------------------------------------------
#  Pembolehubah persekitaran
# ------------------------------------------------------------
[vars]
# OSRM awam — tukar ke tumpangan sendiri bila trafik meningkat
OSRM_BASE_URL = "https://router.project-osrm.org/route/v1/driving"
MAX_RADIUS_M = "90000"
MAX_LIMIT = "200"
DEFAULT_LIMIT = "50"
DEFAULT_TTL_MS = "3600000"
MAX_PEERS_PER_CELL = "500"

# ------------------------------------------------------------
#  Zon operasi — koridor selatan Sabah
#  Pusat di Putatan supaya KK dan Membakut sama jauh.
#  90 km meliputi KK, KKIA, Petagas, Lok Kawi, Papar, Kimanis
#  dan Kg Pimping (Membakut).
# ------------------------------------------------------------
CENTER_LAT = "5.8943"
CENTER_LNG = "116.0505"
GEOFENCE_RADIUS_M = "90000"

# ------------------------------------------------------------
#  Cache laluan (D1) — 7 hari. Geometri jalan berubah sangat lambat,
#  dan laluan Pan Borneo boleh berubah hanya selepas data OSM dikemas kini.
# ------------------------------------------------------------
ROUTE_CACHE_TTL_MS = "604800000"

